[pytest]
pythonpath = .
testpaths = tests
addopts = --no-header --dist=loadscope -p no:playwright -m "not meeting and not interview and not increment and not appraisal and not payroll and not calendar"
norecursedirs = logs reports .pytest_cache artifacts scratch venv .git __pycache__
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs/test.log
log_file_level = INFO
log_file_format = %(asctime)s  %(levelname)-8s  %(name)s  →  %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
filterwarnings = 
    ignore
    ignore::pytest.PytestUnknownMarkWarning
    ignore::pytest.PytestCollectionWarning
timeout = 2400
markers =
    smoke: Quick sanity checks for core workflows
    sanity: Intermediate sanity suite for major UI & API components
    regression: Full regression suite covering all edge cases and modules
    ui: User Interface level Playwright tests
    api: REST API backend validation tests
    asset: Asset management suite
    warranty: Asset warranty expiration and 30-day boundary tests
    boundary_30d: Critical 30-day warranty boundary tests (Day 0, Day +30, Day +31)
    direct_assignment: Direct asset assignment tests
    seeding: Master data seeding suite
    e2e: End-to-end multi-role integration workflows
    payroll: Payroll module tests (API + UI validation)
    recruitment: Recruitment portal and job opening tests
    director_documents: Director document management tests
    leave_validation: Leave form validation tests
    attendance: Attendance and regularization tests
    full_form: Full 12-field form completion test suite
    meeting: Meeting and interview scheduling tests (sends Google invites/emails)
    interview: Interview scheduling tests
    increment: Increment and appraisal workflow tests
    appraisal: Employee appraisal workflow tests
    calendar: Calendar scheduling and event integration tests

[pytest-watch]
ignore = logs,reports,.pytest_cache,artifacts,scratch,venv,.git,__pycache__,*.log
ext = .py
log_level = INFO