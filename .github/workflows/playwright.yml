name: "Playwright Tests"

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: stg
  HEADLESS: "True"
  NODE_OPTIONS: "--no-deprecation"
  NODE_NO_WARNINGS: "1"
  PYTHONWARNINGS: "ignore"

jobs:
  create-pr:
    if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Compare & Create PR Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --json number -q '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            echo "Creating automated PR comparing branch '${{ github.ref_name }}' with 'main'..."
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Auto PR: ${{ github.ref_name }} -> main" \
              --body "Automated Pull Request generated on branch push for \`${{ github.ref_name }}\`." \
              || echo "::warning::To enable auto PR creation, check 'Allow GitHub Actions to create and approve pull requests' in Repository Settings -> Actions -> General -> Workflow permissions."
          else
            echo "PR #${PR_EXISTS} already exists for branch '${{ github.ref_name }}'."
          fi

  test:
    runs-on: ubuntu-latest
    container:
      image: adarsh7777/hrlense_playwright:latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Pre-flight: Check for Merge Conflicts with Main"
        if: github.ref_name != 'main'
        run: |
          echo "🔍 Checking for merge conflicts with origin/main..."
          git fetch origin main --quiet
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git merge --no-commit --no-ff origin/main; then
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort
            fi
            echo "✅ No merge conflicts detected with origin/main."
          else
            echo "::error::Branch has merge conflicts with origin/main! Please merge origin/main and resolve conflicts."
            if [ -f .git/MERGE_HEAD ]; then
              git merge --abort
            fi
            exit 1
          fi

      - name: "Pre-flight: Check for Conflict Markers in Code"
        run: |
          echo "🔍 Checking for unresolved git conflict markers..."
          if git grep -nE "^<{7} |^={7}$|^>{7} " -- ':!*.md' ':!*.log'; then
            echo "::error::Unresolved conflict markers found in repository files!"
            exit 1
          else
            echo "✅ Zero conflict markers detected."
          fi

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Ensure fresh dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install --quiet --no-cache-dir -r requirements.txt
          fi

      - name: "Pre-flight: Test Collection & Import Validation"
        run: |
          echo "🔍 Validating Python syntax, test imports, and fixtures..."
          pytest --collect-only -q || {
            echo "::error::Pytest collection failed! Check imports or syntax errors above."
            exit 1
          }
          echo "✅ All tests, POMs, workflows, and fixtures collected cleanly."

      # Run Dynamic Test Suite (-n auto)
      - name: Run Test Suite
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            MARKER="smoke or sanity"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            MARKER="smoke or regression"
          else
            MARKER="smoke"
          fi

          echo "Executing test suite (-n auto) with marker: $MARKER"
          pytest -m "$MARKER" \
            -n auto \
            --reruns 2 \
            --reruns-delay 1 \
            --html=reports/report.html \
            --self-contained-html \
            --maxfail=1 \
            --disable-warnings \
            --tb=short

      # Add GitHub Step Summary
      - name: Add Execution Summary
        if: always()
        run: |
          echo "### 🧪 HRlens Playwright Smoke Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`$ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Marker**: \`smoke\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode**: Parallel (-n auto)" >> $GITHUB_STEP_SUMMARY
          echo "- **HTML Report & Traces**: Download artifact \`pytest-report\` to inspect execution results and Playwright \`.zip\` traces." >> $GITHUB_STEP_SUMMARY

      # Upload HTML Test Report, Logs, and Traces
      - name: Upload Test Report & Traces
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pytest-report
          path: |
            reports/
            logs/
            .pytest_cache/
            test-results/

  merge:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Set Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: PR Merge & Branch Cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Merging Pull Request #${{ github.event.pull_request.number }} into ${{ github.base_ref }}..."
            gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch || {
              git checkout ${{ github.base_ref }}
              git merge FETCH_HEAD --no-ff -m "Merge PR #${{ github.event.pull_request.number }} into ${{ github.base_ref }} [skip ci]"
              git push origin ${{ github.base_ref }}
            }
          else
            echo "Push event on '${{ github.ref_name }}': Tests verified. Keeping feature branch active for additional commits."
          fi
