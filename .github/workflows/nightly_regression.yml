name: "Nightly Regression Tests"

on:
  schedule:
    # Runs automatically every night at 12:00 AM (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      marker:
        description: 'Pytest marker to execute'
        required: true
        default: 'regression'
        type: choice
        options:
          - regression
          - smoke
          - e2e
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: stg
  HEADLESS: "True"
  NODE_OPTIONS: "--no-deprecation"
  NODE_NO_WARNINGS: "1"
  PYTHONWARNINGS: "ignore"

jobs:
  regression-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-jammy

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        ${{ secrets.ENV_FILE }}
        EOF

    # 1. Install dependencies inside pre-built Playwright container (Quiet Output)
    - name: Install Python dependencies
      run: |
        echo "::group::Installing Python Dependencies"
        python -m pip install --quiet --upgrade pip
        if [ -f requirements.txt ]; then pip install --quiet --no-cache-dir -r requirements.txt; fi
        echo "::endgroup::"

    # 2. Run Parallel Regression Tests (-n auto)
    - name: Run Regression Tests
      run: |
        MARKER="${{ github.event.inputs.marker || 'regression' }}"
        echo "Executing parallel nightly regression suite (-n auto) with marker: $MARKER"
        pytest -m "$MARKER" -n auto --reruns 2 --reruns-delay 1 --html=reports/report.html --self-contained-html --disable-warnings --tb=short

    # 3. Add GitHub Step Summary
    - name: Add Execution Summary
      if: always()
      run: |
        echo "### 🌙 HRlens Nightly Regression Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Environment**: \`$ENV\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Marker Executed**: \`${{ github.event.inputs.marker || 'regression' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **HTML Report & Traces**: Download artifact \`nightly-regression-report\` to inspect results and Playwright \`.zip\` traces." >> $GITHUB_STEP_SUMMARY

    # 4. Upload HTML Test Report, Logs, and Traces
    - name: Upload Test Report & Traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-regression-report
        path: |
          reports/
          logs/
          .pytest_cache/
          test-results/
