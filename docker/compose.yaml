services:
  tests:
    image: adarsh7777/hrlense_playwright:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hrlens-playwright
    working_dir: /app
    env_file:
      - ../.env
    environment:
      - ENV=stg
      - HEADLESS=true
    volumes:
      - ..:/app
      - /app/.pytest_cache
      - ../reports:/app/reports
      - ../logs:/app/logs
    ports:
      - "6080:6080"
    command: ["pytest"]
