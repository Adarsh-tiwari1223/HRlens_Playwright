name: "Playwright Tests"

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: stg
  HEADLESS: "True"
  NODE_OPTIONS: "--no-deprecation"
  NODE_NO_WARNINGS: "1"
  PYTHONWARNINGS: "ignore"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-jammy

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        ${{ secrets.ENV_FILE }}
        EOF

    # 1. Install dependencies inside pre-built Playwright container (Quiet Output)
    - name: Install Python dependencies
      run: |
        echo "::group::Installing Python Dependencies"
        python -m pip install --quiet --upgrade pip
        if [ -f requirements.txt ]; then pip install --quiet --no-cache-dir -r requirements.txt; fi
        echo "::endgroup::"

    # 2. Run Dynamic Parallel Test Suites (-n auto)
    - name: Determine Test Marker & Run Tests
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          MARKER="smoke"
        elif [ "${{ github.ref_name }}" = "develop" ]; then
          MARKER="smoke or sanity"
        elif [ "${{ github.ref_name }}" = "main" ]; then
          MARKER="smoke or regression"
        else
          MARKER="smoke"
        fi
        echo "Executing parallel test suite (-n auto) with marker: $MARKER"
        pytest -m "$MARKER" -n auto --reruns 2 --reruns-delay 1 --html=reports/report.html --self-contained-html --maxfail=1 --disable-warnings --tb=short

    # 3. Add GitHub Step Summary
    - name: Add Execution Summary
      if: always()
      run: |
        echo "### 🧪 HRlens Playwright Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Environment**: \`$ENV\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **HTML Report & Traces**: Download artifact \`pytest-report\` to inspect execution results and Playwright \`.zip\` traces." >> $GITHUB_STEP_SUMMARY

    # 4. Upload HTML Test Report, Logs, and Traces
    - name: Upload Test Report & Traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: |
          reports/
          logs/
          .pytest_cache/
          test-results/


  merge:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "develop" ]; then
            echo "Merging develop into main..."
            git checkout main
            git merge origin/develop --no-ff -m "Merge branch 'develop' into main [skip ci]"
            git push origin main
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Merging pull request #${{ github.event.pull_request.number }} (target: ${{ github.base_ref }}) into ${{ github.base_ref }}..."
            gh pr merge ${{ github.event.pull_request.number }} --merge || {
              git checkout ${{ github.base_ref }}
              git merge FETCH_HEAD --no-ff -m "Merge PR #${{ github.event.pull_request.number }} into ${{ github.base_ref }} [skip ci]"
              git push origin ${{ github.base_ref }}
            }
          else
            echo "Skipping merge for event: ${{ github.event_name }} on branch: ${{ github.ref_name }}"
          fi
