name: "Playwright Tests"

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENV: stg
  HEADLESS: "True"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-jammy

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Create .env file
      run: |
        cat << 'EOF' > .env
        ${{ secrets.ENV_FILE }}
        EOF

    # 1. Install dependencies inside pre-built Playwright container
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi

    # 2. Run Dynamic Test Suites Based on Event Context
    - name: Determine Test Marker & Run Tests
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          MARKER="smoke"
        elif [ "${{ github.ref_name }}" = "develop" ]; then
          MARKER="smoke or sanity"
        elif [ "${{ github.ref_name }}" = "main" ]; then
          MARKER="smoke or regression"
        else
          MARKER="smoke"
        fi
        echo "Executing test suite with marker: $MARKER"
        pytest -m "$MARKER" --reruns 2 --reruns-delay 1 --html=reports/report.html --self-contained-html --maxfail=1 --disable-warnings -v

    # 3. Add GitHub Step Summary
    - name: Add Execution Summary
      if: always()
      run: |
        echo "### 🧪 HRlens Playwright Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Environment**: \`$ENV\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **HTML Report & Traces**: Download artifact \`pytest-report\` to inspect execution results and Playwright \`.zip\` traces." >> $GITHUB_STEP_SUMMARY

    # 4. Upload HTML Test Report, Logs, and Traces
    - name: Upload Test Report & Traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: |
          reports/
          logs/
          .pytest_cache/
          test-results/


  merge:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "develop" ]; then
            echo "Merging develop into main..."
            git checkout main
            git merge origin/develop --no-ff -m "Merge branch 'develop' into main [skip ci]"
            git push origin main
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "Merging pull request #${{ github.event.pull_request.number }} into main..."
            gh pr merge ${{ github.event.pull_request.number }} --merge || {
              # Fallback: if gh cli fails, try git merge
              git checkout main
              git merge FETCH_HEAD --no-ff -m "Merge PR #${{ github.event.pull_request.number }} into main [skip ci]"
              git push origin main
            }
          else
            echo "Skipping merge for event: ${{ github.event_name }} on branch: ${{ github.ref_name }}"
          fi
